name: Agentic AI Sprint — CI/CD Pipeline

# ─────────────────────────────────────────────
# TRIGGERS
# Runs on every push to main and every pull request
# ─────────────────────────────────────────────
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  # ─────────────────────────────────────────────
  # JOB 1 — LINT + SYNTAX CHECK
  # Checks Python files for syntax errors
  # Fast — runs in ~30 seconds
  # ─────────────────────────────────────────────
  lint:
    name: Lint + Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install linting tools
        run: |
          pip install flake8 pyflakes

      - name: Check Python syntax (pyflakes)
        run: |
          pyflakes day36_fraud_api.py || true
          pyflakes day36_test_api.py || true
          echo "✅ Syntax check complete"

      - name: Lint with flake8 (warnings only)
        run: |
          flake8 day36_fraud_api.py --max-line-length=120 --exit-zero
          flake8 day36_test_api.py --max-line-length=120 --exit-zero
          echo "✅ Lint check complete"

  # ─────────────────────────────────────────────
  # JOB 2 — UNIT TESTS
  # Runs the API test suite against a live server
  # ─────────────────────────────────────────────
  test:
    name: API Tests
    runs-on: ubuntu-latest
    needs: lint  # Only runs if lint passes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install fastapi uvicorn httpx python-dotenv pydantic

      - name: Start API server in background
        run: |
          uvicorn day36_fraud_api:app --host 0.0.0.0 --port 8000 &
          echo "Waiting for server to start..."
          sleep 5
          curl -f http://localhost:8000/health || exit 1
          echo "✅ Server is up"

      - name: Run API test suite
        run: |
          python day36_test_api.py

      - name: Verify health endpoint
        run: |
          curl -f http://localhost:8000/health
          echo "✅ Health check passed"

  # ─────────────────────────────────────────────
  # JOB 3 — DOCKER BUILD
  # Builds the Docker image to verify it compiles
  # Does NOT push to registry (no DockerHub secret needed)
  # ─────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test  # Only runs if tests pass

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t fraud-agent:latest .
          echo "✅ Docker image built successfully"

      - name: Verify Docker image
        run: |
          docker images fraud-agent
          echo "✅ Docker image verified"

  # ─────────────────────────────────────────────
  # JOB 4 — SECURITY SCAN
  # Scans for known vulnerabilities in dependencies
  # ─────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install safety
        run: |
          pip install safety

      - name: Run dependency security scan
        run: |
          safety check -r requirements_docker.txt --output text || true
          echo "✅ Security scan complete"

  # ─────────────────────────────────────────────
  # JOB 5 — NOTIFY
  # Prints a summary of the pipeline result
  # ─────────────────────────────────────────────
  notify:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [lint, test, docker-build, security]
    if: always()

    steps:
      - name: Print pipeline summary
        run: |
          echo "════════════════════════════════════════"
          echo "  AGENTIC AI SPRINT — CI/CD SUMMARY"
          echo "════════════════════════════════════════"
          echo "  Lint:         ${{ needs.lint.result }}"
          echo "  Tests:        ${{ needs.test.result }}"
          echo "  Docker Build: ${{ needs.docker-build.result }}"
          echo "  Security:     ${{ needs.security.result }}"
          echo "════════════════════════════════════════"
          echo "  Commit: ${{ github.sha }}"
          echo "  Branch: ${{ github.ref_name }}"
          echo "  Author: ${{ github.actor }}"
          echo "════════════════════════════════════════"
